version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: ims_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ims_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: ims_api
    restart: always
    depends_on:
      - postgres
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:password@postgres:5432/ims_db
      JWT_SECRET: 263a8cd5a5c0eb4a5481084838a7918e74963f583c0ada649be017fdc1d52780
      TOKEN_EXPIRATION: 3600
      REFRESH_TOKEN_EXPIRATION: 86400
      NODE_ENV: development
    ports:
      - "5000:5000"  # API server
      - "9229:9229"  # Debugging port for VS Code or Chrome
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    command: ["/bin/sh", "./entrypoint.sh"]
volumes:
  postgres_data: {}
  api_node_modules: {}
